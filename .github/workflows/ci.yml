name: NST Stable CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --no-check-publish
      - name: PHP syntax check
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json
      - run: npm ci
      - run: npm run build
