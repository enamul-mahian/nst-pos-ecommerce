name: NST Auto Deploy

on:
  workflow_run:
    workflows: ["NST Stable CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Admin POS
        working-directory: frontend-admin
        run: |
          npm ci
          npm run build

      - name: Build Customer Site
        working-directory: frontend-customer
        run: |
          npm ci
          npm run build

      - name: Prepare Release
        run: |
          mkdir -p release/frontend-admin-dist
          mkdir -p release/frontend-customer-dist

          cp -a backend release/backend
          cp -a frontend-admin/dist/. release/frontend-admin-dist/
          cp -a frontend-customer/dist/. release/frontend-customer-dist/

          tar -czf nst-release.tar.gz -C release .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/nst_deploy
          chmod 600 ~/.ssh/nst_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload Release
        run: |
          scp -i ~/.ssh/nst_deploy \
          nst-release.tar.gz \
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/newsingapurtele/releases/nst-release.tar.gz"

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/nst_deploy \
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
          "sudo -n /usr/local/sbin/nst-deploy"